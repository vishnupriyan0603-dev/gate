<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GATE AI Trainer — Options</title>
  <style>
    body { background: #0f172a; color: #e2e8f0; font: 14px system-ui, sans-serif; padding: 24px; max-width: 640px; margin: auto; }
    h1 { color: #a5b4fc; }
    label { display: block; margin: 14px 0 6px; color: #94a3b8; }
    input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; }
    #msg { margin-top: 12px; font-size: 13px; }
    .ok { color: #6ee7b7; } .err { color: #f87171; }
    p.hint { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <h1>GATE 2027 AI Trainer — Options</h1>
  <p class="hint">Point the extension at your local trainer app. The default should work if XAMPP is running.</p>
  <label for="appUrl">Trainer app URL</label>
  <input id="appUrl" placeholder="http://localhost/gate%20exam%20preparation/public">
  <label for="groqModel">Groq model (shown for reference — change in the web app Settings → AI)</label>
  <input id="groqModel" disabled>
  <p class="hint">The Groq API key lives only on your server (Settings → AI). The extension never sees it.</p>
  <button id="save">Save</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
