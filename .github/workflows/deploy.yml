name: Deploy to InfinityFree Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli, json, curl
          tools: composer:v2

      - name: 📦 Install Backend Dependencies (Composer)
        run: |
          cd main
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress
        env:
          COMPOSER_ALLOW_SUPERUSER: 1

      - name: ⬡ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: main/frontend/package-lock.json

      - name: 🎨 Build Frontend (Vite + Tailwind + TS)
        run: |
          cd main/frontend
          npm ci
          npm run build
          mkdir -p ../../assets
          cp -r ../public/assets/* ../../assets/

      - name: 🔐 Prepare Production .env
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.FTP_PASSWORD || '7I6lBin7Uxmy' }}
          DB_USER: ${{ secrets.DB_USER || 'if0_42957568' }}
          DB_NAME: ${{ secrets.DB_NAME || 'if0_42957568_gate' }}
          DB_HOST: ${{ secrets.DB_HOST || 'sql103.infinityfree.com' }}
          APP_URL: ${{ secrets.APP_URL || 'https://gatexam27.free.nf/' }}
        run: |
          if [ -n "$PRODUCTION_ENV" ]; then
            echo "$PRODUCTION_ENV" > main/.env
          else
            cat > main/.env << EOF
          CI_ENVIRONMENT = development
          app.baseURL = '${APP_URL}'
          app.indexPage = ''
          app.forceGlobalSecureRequests = false

          database.default.hostname = ${DB_HOST}
          database.default.database = ${DB_NAME}
          database.default.username = ${DB_USER}
          database.default.password = "${DB_PASSWORD}"
          database.default.DBDriver = MySQLi
          database.default.DBPrefix =
          database.default.port = 3306
          database.default.charset = utf8mb4
          database.default.DBCollat = utf8mb4_unicode_ci
          database.default.DBDebug = true

          session.driver = 'CodeIgniter\Session\Handlers\FileHandler'
          logger.threshold = 4
          encryption.key = hex2bin:96946d529ba94185f8eff93510c58713c7fa6ef38b0880f9abc3e2018e1d9f1d
          EOF
          fi

          # Ensure .env is available at both root and main/ directory
          cp main/.env .env

          # Inject database password fallback in Database.php for environments where .env is blocked
          php -r '
            $pass = getenv("DB_PASSWORD");
            if (!empty($pass)) {
              $file = "main/app/Config/Database.php";
              $content = file_get_contents($file);
              $content = preg_replace_callback(
                "/\x27password\x27\s*=>\s*env\(\x27database\.default\.password\x27,\s*\x27[^\x27]*\x27\)/",
                function() use ($pass) {
                  return "\x27password\x27     => env(\x27database.default.password\x27, \x27" . addcslashes($pass, "\x27\\\\") . "\x27)";
                },
                $content
              );
              file_put_contents($file, $content);
              echo "Injected database password into Database.php\n";
            }
          '

      - name: 📁 Ensure Writable Directories Exist
        run: |
          mkdir -p main/writable/cache main/writable/logs main/writable/session main/writable/uploads main/writable/debugbar
          touch main/writable/index.html main/writable/cache/index.html main/writable/logs/index.html main/writable/session/index.html main/writable/uploads/index.html main/writable/debugbar/index.html
          chmod -R 777 main/writable

      - name: 🚀 Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftpupload.net' }}
          username: ${{ secrets.FTP_USERNAME || 'if0_42957568' }}
          password: ${{ secrets.FTP_PASSWORD || '7I6lBin7Uxmy' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'htdocs/' }}
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            main/frontend/**
            main/tests/**
            main/build/**
            .github/**
            README.md
            GEMINI.md
